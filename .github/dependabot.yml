version: 2
updates:
  # Third-party GitHub Actions — keeps every workflow action current and
  # off stale/floating tags, which is exactly the class of risk the
  # aquasecurity/trivy-action supply-chain compromise (March 2026) exposed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Tracks the pinned image tags in docker-compose.yml. Dependabot's `docker`
  # ecosystem only reads Dockerfiles; compose files need the separate
  # `docker-compose` ecosystem (GA Feb 2025). With `docker` here no image PR
  # ever opened and the pins fell behind.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # A Postgres major needs pg_upgrade or a dump/restore on the existing
      # volume; as a plain tag bump it would leave users' stacks unable to boot.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
